# MACRO DIRECTION — a cadeia rapida. Roda sozinha, sem a maquina de ninguem.
#
# POR QUE ELA EXISTE
#   A cadeia pesada roda 2x por dia (04:35 e 08:35 BRT). Isso serve para curva de juro, que e
#   D+1 por natureza. Nao serve para o calendario de noticias, que muda quando o numero sai.
#   Ate 02/set os scripts do leitor nao estavam em cadeia nenhuma — so rodavam quando alguem
#   os executava na mao, e por isso o painel ficava congelado.
#
# O QUE ELA PRODUZ, EM ORDEM
#   1. calendario_resultado.json  FXStreet: divulgado + consenso + surpresa, 8 moedas, com o
#                                 atraso de entrega medido por evento (HIGH: mediana ~44 s)
#   2. eua_leitura.json           BLS (CPI, NFP, desemprego, salario) + calendario do FOMC
#   3. bancos_centrais.json       as 8 taxas e as proximas reunioes
#   4. macro_eventos.json         o calendario INTERPRETADO — le a FXStreet; cai no Forex
#                                 Factory so se a FXStreet faltar
#
# ⚠️ O LIMITE HONESTO: o GitHub Actions NAO e tempo real.
#   O minimo do cron e 5 minutos, e a propria documentacao do GitHub diz que o `schedule`
#   "can be delayed during periods of high loads" e que "some queued jobs may be dropped".
#   Entao "*/15" na pratica quer dizer "a cada 15 a 35 minutos". A FONTE entrega em segundos;
#   o RELOGIO e que entrega em minutos. Para leitura no instante e preciso um processo
#   sempre ligado (VPS de ~US$5/mes), e essa decisao e anterior a qualquer fornecedor.
#
# ⚠️ CADA FONTE FALHA SOZINHA. Os leitores externos rodam com continue-on-error e nunca
#   sobrescrevem o arquivo anterior quando a busca falha — o site mostra dado de 1 h atras com
#   o carimbo de 1 h atras, nunca dado velho com carimbo novo. A cota do BLS (25/dia sem
#   chave) e a razao do cache de 60 min dentro do eua_leitor.py; com BLS_API_KEY nos secrets
#   viram 500/dia.
#
# CUSTO: zero. Actions e ilimitado em repositorio publico.

name: macro-direction

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-direction
  cancel-in-progress: true

jobs:
  atualiza:
    runs-on: ubuntu-latest
    # 15 e nao 8: sao cinco fontes externas em sequencia, cada uma com ate 45-60 s de timeout
    # proprio; 8 min era menor que a soma no pior caso (revisao de 03/set)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: encoding
        run: echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV

      # O feed semanal do Forex Factory — a RESERVA. Baixado direto, sem passar pelo TTL do
      # update_fund.py (2 horas, bloquearia a atualizacao de 15 minutos).
      - name: feed de reserva (Forex Factory)
        continue-on-error: true
        run: |
          mkdir -p data/raw
          curl -sS -L --max-time 60 --retry 2 \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            -o data/raw/ff_calendar_thisweek.json.novo
          # so troca se veio JSON valido e nao vazio — senao mantem o anterior
          python - <<'PY'
          import json, os, shutil
          novo = "data/raw/ff_calendar_thisweek.json.novo"
          alvo = "data/raw/ff_calendar_thisweek.json"
          try:
              d = json.load(open(novo, encoding="utf-8"))
              n = len(d if isinstance(d, list) else d.get("events", []))
              if n > 0:
                  shutil.move(novo, alvo)
                  print("feed trocado: %d eventos" % n)
              else:
                  print("feed veio vazio — mantido o anterior")
          except Exception as e:
              print("feed invalido (%s) — mantido o anterior" % e)
          finally:
              if os.path.exists(novo):
                  os.remove(novo)
          PY

      # A PRIMARIA. Sai com codigo 1 e NAO sobrescreve quando a fonte nao responde — por isso
      # o continue-on-error: o passo fica vermelho no log, a cadeia segue com o arquivo anterior.
      - name: calendario com resultado (FXStreet)
        continue-on-error: true
        run: python fxstreet_calendario.py

      # BLS + Fed. Cache de 60 min dentro do script: o dado e mensal, e a cota e diaria.
      # Sai com codigo 2 quando a cota acaba, preservando a leitura anterior.
      - name: leitor dos Estados Unidos (BLS + Fed)
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python eua_leitor.py

      # A camada de TEXTO: frases de postura dos discursos e do comunicado, direto do Fed.
      # Extracao por expressao, rotulada como tal — nao e interpretacao.
      - name: discursos do Fed (frases de postura)
        continue-on-error: true
        run: python fed_discursos.py

      - name: gera o leitor
        run: |
          python bancos_centrais.py
          python macro_eventos.py

      # A leitura PARA FRENTE: por moeda (4 dimensoes, 25% cada) e por par (a regra do
      # Eduardo). Busca 42 dias da FXStreet por conta propria; se ela falhar, usa o arquivo
      # local com janela curta e declara isso na saida.
      # Juro americano x NQ/ES/ouro, medido: 5 anos diarios (Yahoo + H.15 + Tesouro), blocos
      # sem sobreposicao. Dado diario — cache de 20 h dentro do script.
      - name: correlacao juro x futuros
        continue-on-error: true
        run: python correlacao_juros.py

      - name: sentimento (moeda e par)
        continue-on-error: true
        run: python sentimento.py

      # Commit so quando o conteudo mudou de verdade. Sem isto seriam 96 commits vazios por
      # dia, e o historico do repositorio viraria lixo.
      - name: commita se mudou
        run: |
          git config user.name  "hci-bot"
          git config user.email "bot@hokiresearch.com"
          git add data/macro_eventos.json data/bancos_centrais.json \
                  data/calendario_resultado.json data/eua_leitura.json \
                  data/fed_discursos.json data/sentimento.json \
                  data/correlacao_juros.json data/raw/ff_calendar_thisweek.json
          if git diff --cached --quiet; then
            echo "nada mudou — sem commit"
          else
            git commit -q -m "macro direction $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main || true
            git push -q origin main
            echo "commitado"
          fi
