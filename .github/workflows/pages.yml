# Publica o site no GitHub Pages a cada mudanca de dados.
# O artefato leva SO o que o navegador usa: html/js/css + data JSONs +
# calendarios. Fica de fora: data/core (43MB de fonte crua) e data/raw.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: montar site
        run: |
          mkdir -p _site/data/calendar _site/data/raw
          cp index.html app.js styles.css theme.css ui_cut_global.js ui_extras.js _site/
          cp data/*.json _site/data/ 2>/dev/null || true
          cp data/calendar/*.json _site/data/calendar/
          cp data/raw/tv_nowcast.json _site/data/raw/ 2>/dev/null || true
          cp data/raw/ff_calendar_thisweek.json _site/data/raw/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
