# Cadeia PESADA 2x/dia: busca yields oficiais, recalcula FUND, calendarios,
# projecao e COT, e commita os dados. Espelha a schtask HCI_FUND_Radar_Update.
# update_setups NAO roda na nuvem (fase 2): depende de modulos do hci-ea local.
#
# 31-ago-2026: migrados para ca (decisao do Eduardo — nada roda na maquina dele):
#   - fund_custo_carrego  swap estimado do diferencial de 2a, calibrado contra a FTMO
#   - macro_calendar      ForexFactory + FOMC fixo (era a schtask "HCI Calendar Daily")
name: cadeia-2x-dia
on:
  schedule:
    - cron: "35 7 * * *"     # ~04:35 BRT
    - cron: "35 11 * * *"    # ~08:35 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  cadeia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: dependencias
        run: pip install --quiet numpy pandas openpyxl scikit-learn pyarrow
      - name: encoding
        run: echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV
      - name: cadeia
        run: |
          python tv_yields_nowcast.py || echo "nowcast falhou, segue oficial"
          python update_yields.py
          python update_yields.py --calendario
          python update_fund.py
          python projection_history.py
          python update_cot.py || echo "COT falhou, segue"
          python macro_calendar.py --refresh || echo "calendario macro falhou, segue"
          python fund_custo_carrego.py || echo "custo de carrego falhou, segue"
          python fund_ficha_par.py || echo "ficha do par falhou, segue"
          python juros_vs_cambio.py || echo "juros x cambio falhou, segue"

      # ⚠️ A GUARDA. Em 31/ago todas as fontes ficaram uma semana congeladas e nada
      # reclamou: o TTL lia o mtime, e o checkout reescreve o mtime a cada execucao.
      # Este passo confere a ULTIMA DATA DENTRO de cada arquivo e FALHA de proposito.
      # Melhor a Action vermelha do que o painel publicando dado velho como atual.
      - name: guarda de frescor
        run: python frescor.py --estrito
      - name: commit
        run: |
          git config user.name "hci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git commit -m "cadeia $(date -u +%Y-%m-%dT%H:%M)Z" || echo "sem mudanca"
          git pull --rebase origin main || true
          git push
